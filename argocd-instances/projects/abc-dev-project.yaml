apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: abc-dev
  namespace: abc-dev-argocd
spec:
  description: Project for abc-dev-argocd namespace Applications and ApplicationSets

  sourceNamespaces:
    - abc-dev-argocd

  destinations:
    - namespace: 'abc-dev-argocd*'
      server: https://kubernetes.default.svc

  sourceRepos:
    - https://github.com/dtolgyg/argocd-operator-install

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace