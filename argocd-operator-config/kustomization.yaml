---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - operator-manifest-v0.18.yaml

patches:
  - target:
      version: v1
      group: apps
      kind: Deployment
      name: argocd-operator-controller-manager
      namespace: argocd-operator-system
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-operator-controller-manager
        namespace: argocd-operator-system
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                  - name: ARGOCD_CLUSTER_CONFIG_NAMESPACES
                    value: "argocd-operator-system"